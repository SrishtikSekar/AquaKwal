services:
  namenode:
    image: aquakwal-namenode:hadoop3.2.1-pig0.17.0
    build:
      context: .
      dockerfile: Dockerfile.namenode
    container_name: namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=aquakwal-cluster
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - PIG_HOME=/opt/pig
      - PATH=/opt/pig/bin:/opt/hadoop-3.2.1/bin:/opt/hadoop-3.2.1/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ../data:/data
      - ../pig:/pig-scripts:ro
    ports:
      - "9870:9870"
      - "8020:8020"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 15

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      - DATANODE_NON_HDFS_USER=root
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - ../data:/data

  hive-server:
    image: bde2020/hive:2.3.2
    container_name: hive-server2
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode
    working_dir: /opt/hive/bin
    command: ["/bin/bash", "/hive-scripts/startup.sh"]
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      - HIVE_CONF_hive_jdbc_seatbelt=false
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    volumes:
      - ../data:/data
      - ../hive:/hive-scripts:ro

  spark-master:
    image: aquakwal-spark-master:3.2.1-hadoop3.2
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        SPARK_BASE: bde2020/spark-master:3.2.1-hadoop3.2
    container_name: spark-master
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode
    environment:
      - INIT_DAEMON_STEP=setup_spark
    volumes:
      - ../spark:/spark-scripts:rw
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: aquakwal-spark-worker:3.2.1-hadoop3.2
    build:
      context: .
      dockerfile: Dockerfile.spark
      args:
        SPARK_BASE: bde2020/spark-worker:3.2.1-hadoop3.2
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ../spark:/spark-scripts:rw
    ports:
      - "4040:4040"
